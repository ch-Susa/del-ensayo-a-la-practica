<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulces Antojos</title>
    <link rel="stylesheet" href="/del-ensayo-a-la-practica/CSS/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-container">
            <a href="/del-ensayo-a-la-practica/index.html" class="logo">Dulces Antojos</a>
            <a href="/del-ensayo-a-la-practica/index.html" class="nav-link active">Inicio</a>
            <a href="/del-ensayo-a-la-practica/redirecciones/catalogo.html" class="nav-link">Catálogo</a>
            <a href="#contacto" class="nav-link">Contáctanos</a>
            <button class="btn btn-outline-success">420</button>
        </div>
    </nav>

    <main>

        <section id="inicio" class="hero">
            <div class="hero-card">
                <div class="hero-text">
                    <h1>Dulces<br>Momentos</h1>
                    <p>Hechos para ti</p>
                    <button class="btn-catalogo" onclick="irAlCatalogo()">
                        Ver Catálogo
                    </button>
                </div>

                <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=500&q=80"
                     alt="Pastel">
            </div>
        </section>

        <section id="catalogo" class="promociones">
            <h2><span>★</span> Promociones</h2>

            <div class="productos">

                <article class="producto">
                    <img src="https://images.unsplash.com/photo-1519869325930-281384150729?auto=format&fit=crop&w=300&q=80"
                         alt="Cupcakes">
                    <div>
                        <h3>Cupcakes</h3>
                        <p>$2.000</p>
                    </div>
                </article>

                <article class="producto">
                    <img src="https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=300&q=80"
                         alt="Donas">
                    <div>
                        <h3>Donas</h3>
                        <p>$600</p>
                    </div>
                </article>

                <article class="producto">
                    <img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=300&q=80"
                         alt="Torta de fresa">
                    <div>
                        <h3>Torta de fresa</h3>
                        <p>$5.000</p>
                    </div>
                </article>

                <article class="producto">
                    <img src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=300&q=80"
                         alt="Brownies">
                    <div>
                        <h3>Brownies</h3>
                        <p>$10.000</p>
                    </div>
                </article>

            </div>
        </section>

        <section id="contacto" class="contacto">
            <h2>Contáctanos</h2>
            <p>¿Tienes algún antojo?</p>
            <a href="#" class="contacto-btn">Escríbenos</a>
        </section>

    </main>

    <script src="/del-ensayo-a-la-practica/JS/script.js"></script>
</body>
</html>
