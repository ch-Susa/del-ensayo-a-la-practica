<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Dulces Antojos</title>
    <link rel="stylesheet" href="/del-ensayo-a-la-practica/CSS/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-container">
            <a href="/del-ensayo-a-la-practica/index.html" class="logo">Dulces Antojos</a>
            <a href="/del-ensayo-a-la-practica/index.html" class="nav-link">Inicio</a>
            <a href="catalogo.html" class="nav-link active">Catálogo</a>
            <a href="#contacto" class="nav-link">Contáctanos</a>
            <button class="btn btn-outline-success">420</button>
        </div>
    </nav>

    <main>

        <section class="catalogo">
            <div class="buscador">
                <span>⌕</span>
                <input type="text" placeholder="Buscar producto">
                <button>×</button>
            </div>

            <div class="categorias">
                <button class="categoria activa">Todos</button>
                <button class="categoria">Tortas</button>
                <button class="categoria">Postres</button>
            </div>

            <div class="catalogo-productos">

                <article class="producto catalogo-producto">
                    <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=300&q=80"
                         alt="Pastel de frambuesa">
                    <div>
                        <h3>Pie de frambuesa</h3>
                        <p>$12.000</p>
                        <button>Ver Detalles</button>
                    </div>
                </article>

                <article class="producto catalogo-producto">
                    <img src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=300&q=80"
                         alt="Brownie">
                    <div>
                        <h3>Brownie</h3>
                        <p>$2.000</p>
                        <button>Ver Detalles</button>
                    </div>
                </article>

                <article class="producto catalogo-producto">
                    <img src="https://images.unsplash.com/photo-1499636136210-6f4ee915583e?auto=format&fit=crop&w=300&q=80"
                         alt="Galletas">
                    <div>
                        <h3>Galletas</h3>
                        <p>$2.000</p>
                        <button>Ver Detalles</button>
                    </div>
                </article>

                <article class="producto catalogo-producto">
                    <img src="https://images.unsplash.com/photo-1558326567-98ae2405596b?auto=format&fit=crop&w=300&q=80"
                         alt="Macarons">
                    <div>
                        <h3>Macarons</h3>
                        <p>$3.000</p>
                        <button>Ver Detalles</button>
                    </div>
                </article>

            </div>
        </section>

        <section id="contacto" class="contacto">
            <h2>Contáctanos</h2>
            <p>¿Tienes algún antojo?</p>
            <a href="#" class="contacto-btn">Escríbenos</a>
        </section>

    </main>

    <script src="/del-ensayo-a-la-practica/JS/script.js"></script>
</body>
</html>
